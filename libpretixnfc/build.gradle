plugins {
    id "java-library"
    id "jacoco"
    alias(nfcCoreLibs.plugins.kotlin.jvm)
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

jacoco {
    toolVersion = "0.8.7"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

check.dependsOn jacocoTestReport

dependencies {
    implementation nfcCoreLibs.bcpkix.jdk15to18
    implementation nfcCoreLibs.bcprov.jdk15to18
    testImplementation nfcCoreLibs.junit
}
